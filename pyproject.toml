[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-harness"
version = "1.0.0"
description = "Reproducible coding-agent comparisons with withheld tests and offline fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ai-dev-2024"}]
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "httpx>=0.27,<1", "jinja2>=3.1,<4"]

[project.optional-dependencies]
grade = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "mypy>=1.11,<2", "ruff>=0.16,<0.17", "types-PyYAML>=6", "build>=1.2,<2"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=agent_eval --cov-report=term-missing"

[tool.coverage.run]
source = ["agent_eval"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
