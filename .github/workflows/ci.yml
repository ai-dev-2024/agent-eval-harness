name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict
      - run: pytest --cov-report=xml
      - run: python -m build

  offline-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[grade]'
      - run: agent-eval run examples/mock-demo.yaml --out runs/ci-demo
      - run: agent-eval report runs/ci-demo/results.jsonl --format md
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo-report
          path: runs/ci-demo/report.html
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag agent-eval-harness .
      - run: docker run --rm --network none agent-eval-harness run examples/mock-demo.yaml --out /tmp/demo
